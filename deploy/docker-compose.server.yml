name: mostarmanus

# 服务器已有 /opt/postgres 中的 pgvector 容器和博客 Caddy。
# 这个文件只启动 Agent 后端，并加入两个已有 Docker 网络。
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mostar-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PG_HOST: ${PG_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.7-flash}
      OPENAI_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY:-}
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      MOSTAR_ADMIN_TOKEN: ${MOSTAR_ADMIN_TOKEN:?MOSTAR_ADMIN_TOKEN is required}
      MOSTAR_ADMIN_TOKEN_REQUIRED: ${MOSTAR_ADMIN_TOKEN_REQUIRED:-true}
      MOSTAR_CHAT_TOKEN_REQUIRED: ${MOSTAR_CHAT_TOKEN_REQUIRED:-false}
      MOSTAR_CHAT_REQUESTS_PER_MINUTE: ${MOSTAR_CHAT_REQUESTS_PER_MINUTE:-20}
    volumes:
      - ../data/knowledge:/data/knowledge
      - ../data/app-tmp:/app/tmp
    ports:
      - "127.0.0.1:8123:8123"
    networks:
      blog_default:
        aliases: [mostar-app]
      postgres_default:
        aliases: [mostar-app]
    mem_limit: 896m

networks:
  blog_default:
    external: true
  postgres_default:
    external: true
